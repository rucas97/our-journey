<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#06060c" />
<title>The Long Road</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; margin: 0;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: #06060c; color: #e8e8f2;
}
.scenes { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.scene {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 1.2s ease;
  background-size: cover; background-position: center;
  background-repeat: no-repeat;
}
.scene.active { opacity: 1; }
.scene::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,.6) 100%);
  pointer-events: none;
}
.overlay-grid {
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(120,90,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,90,255,.06) 1px, transparent 1px);
  background-size: 46px 46px;
  -webkit-mask-image: radial-gradient(circle at 50% 45%, transparent 30%, #000 100%);
          mask-image: radial-gradient(circle at 50% 45%, transparent 30%, #000 100%);
  pointer-events: none; z-index: 1;
}
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: .22;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
}
.app {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
.viewport { flex: 1; position: relative; overflow: hidden; min-height: 0; }
.world {
  position: absolute; left: 0; right: 0; top: 0;
  will-change: transform;
  transform: translate3d(0, 0, 0);
}
.road {
  position: absolute; left: 50%; top: 0; bottom: 0;
  width: 104px; transform: translateX(-50%);
  border-radius: 14px;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.015) 0 2px, transparent 2px 6px),
    linear-gradient(180deg, rgba(20,20,28,.94) 0%, rgba(10,10,16,.96) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,45,120,.22),
    inset 0 0 0 5px rgba(255,255,255,.025),
    0 0 50px rgba(255,45,120,.14),
    0 22px 50px rgba(0,0,0,.7);
}
.road::before {
  content: ""; position: absolute;
  left: 50%; top: 40px; bottom: 40px;
  width: 3px; margin-left: -1.5px;
  background: repeating-linear-gradient(180deg, rgba(255,176,32,.8) 0 18px, transparent 18px 38px);
  border-radius: 3px;
}
.markers { position: absolute; inset: 0; }
.marker {
  position: absolute; left: 50%;
  width: 26px; height: 26px; margin-left: -13px;
  transform: rotate(45deg); border-radius: 4px;
  background: #0d0d15; border: 2px solid rgba(255,45,120,.5);
  box-shadow: 0 0 14px rgba(255,45,120,.35), inset 0 0 8px rgba(255,45,120,.12);
  display: grid; place-items: center; pointer-events: none;
  transition: border-color .35s, box-shadow .35s, background .35s;
}
.marker span {
  transform: rotate(-45deg);
  font: 700 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
  color: #ff5f95; transition: color .35s;
}
.marker.done {
  border-color: rgba(34,211,238,.9); background: rgba(34,211,238,.14);
  box-shadow: 0 0 22px rgba(34,211,238,.6), inset 0 0 10px rgba(34,211,238,.2);
}
.marker.done span { color: #7ce7f7; }
.car {
  position: absolute; left: 50%; top: 0;
  width: 46px; transform: translate(-50%, 0);
  z-index: 5; will-change: transform;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.6));
  transition: filter .25s;
  pointer-events: none;
}
.car.lit {
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)) drop-shadow(0 0 26px rgba(255,45,120,.95));
}
.hud {
  padding: 16px 20px 10px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
}
.hud-label {
  display: block; font: 700 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .22em; color: #ff5f95; margin-bottom: 6px;
}
.hud-title {
  display: block; font: 800 19px/1 "Inter", system-ui, sans-serif;
  letter-spacing: .04em; color: #f2f2fa; text-transform: uppercase;
}
.hud-right { display: flex; align-items: center; gap: 8px; }
.hud-count {
  font: 700 13px/1 ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .1em; color: #22d3ee; padding: 7px 11px;
  border: 1px solid rgba(34,211,238,.35); border-radius: 6px;
  background: rgba(34,211,238,.07); white-space: nowrap;
}
.mute-btn {
  -webkit-appearance: none; appearance: none;
  width: 34px; height: 34px; padding: 0;
  border-radius: 8px; border: 1px solid rgba(255,255,255,.12);
  background: rgba(10,10,18,.7); color: #a0a0b8; cursor: pointer;
  display: grid; place-items: center;
}
.mute-btn.muted { color: #ff5f95; opacity: .6; }
.bar-wrap { padding: 0 20px 8px; }
.bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #ff2d78, #ff7ab0, #22d3ee);
  box-shadow: 0 0 12px rgba(255,45,120,.7);
  transition: width .5s cubic-bezier(.2,.9,.3,1);
}
.hint {
  margin: 0 auto 12px; padding: 7px 14px; border-radius: 999px;
  font: 700 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .18em; text-transform: uppercase; color: #9a9ab8;
  background: rgba(10,10,18,.7); border: 1px solid rgba(255,255,255,.08);
  transition: opacity .4s, transform .4s; pointer-events: none;
  animation: hintPulse 2.6s ease-in-out infinite;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.hint.hidden { opacity: 0; transform: translateY(10px); animation: none; }
@keyframes hintPulse {
  0%, 100% { border-color: rgba(255,255,255,.08); color: #9a9ab8; }
  50% { border-color: rgba(255,45,120,.4); color: #ff9ec4; }
}
.pedals {
  position: absolute; bottom: max(20px, env(safe-area-inset-bottom));
  left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 0 22px; z-index: 20; pointer-events: none;
}
.pedal {
  pointer-events: auto;
  width: 78px; height: 78px; border: 0; border-radius: 50%;
  font: 800 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .12em; cursor: pointer;
  transition: transform .08s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  color: #fff; user-select: none; -webkit-user-select: none;
}
.pedal svg { display: block; }
.pedal-gas {
  background: radial-gradient(circle at 30% 28%, #ff8fb0, #ff2d78 45%, #a01850 100%);
  box-shadow:
    0 8px 22px rgba(255,45,120,.45), 0 0 40px rgba(255,45,120,.25),
    inset 0 -4px 10px rgba(0,0,0,.25), inset 0 4px 6px rgba(255,255,255,.3);
}
.pedal-gas.pressed {
  transform: translateY(3px) scale(.95);
  box-shadow:
    0 4px 14px rgba(255,45,120,.8), 0 0 70px rgba(255,45,120,.6),
    inset 0 -2px 6px rgba(0,0,0,.3), inset 0 2px 4px rgba(255,255,255,.2);
}
.pedal-rev {
  width: 62px; height: 62px;
  background: radial-gradient(circle at 30% 28%, #3a3a4a, #1a1a28 60%, #0a0a14 100%);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow:
    0 6px 16px rgba(0,0,0,.6),
    inset 0 -3px 8px rgba(0,0,0,.4), inset 0 3px 5px rgba(255,255,255,.15);
  color: #a0a0b8;
}
.pedal-rev.pressed {
  transform: translateY(3px) scale(.95);
  box-shadow:
    0 3px 10px rgba(0,0,0,.7),
    inset 0 -2px 5px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.1);
  color: #22d3ee;
}
.modal {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 18px;
  background: rgba(5,5,10,.82);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 50;
}
.modal.show { opacity: 1; pointer-events: auto; }
.card {
  width: min(400px, 100%); max-height: 88vh;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 18px 18px 20px; border-radius: 18px;
  background: linear-gradient(180deg, #16161f 0%, #0c0c13 100%);
  border: 1px solid rgba(255,45,120,.28);
  box-shadow: 0 0 0 1px rgba(255,255,255,.03), 0 34px 80px rgba(0,0,0,.85), 0 0 70px rgba(255,45,120,.16);
  transform: translateY(24px) scale(.94);
  transition: transform .4s cubic-bezier(.2,.9,.3,1.2);
}
.modal.show .card { transform: translateY(0) scale(1); }
.card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.card-num {
  font: 800 11px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .16em;
  color: #0b0b12; background: linear-gradient(90deg, #ff2d78, #ff7ab0);
  padding: 6px 9px; border-radius: 5px;
}
.card-icon { font-size: 20px; line-height: 1; }
.card h2 {
  margin: 0 0 14px; font: 800 17px/1.25 "Inter", system-ui, sans-serif;
  letter-spacing: .05em; text-transform: uppercase; color: #f2f2fa;
}
.collage { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.collage figure {
  margin: 0; position: relative; overflow: hidden;
  border-radius: 10px; background: #12121b;
  border: 1px solid rgba(255,255,255,.06);
}
.collage figure.hero { grid-column: 1 / -1; aspect-ratio: 16 / 10; }
.collage figure.thumb { aspect-ratio: 1 / 1; }
.collage img { display: block; width: 100%; height: 100%; object-fit: cover; }
.card p { margin: 0 0 18px; font: 400 14px/1.65 "Inter", system-ui, sans-serif; color: #a0a0b8; }
.btn {
  -webkit-appearance: none; appearance: none;
  width: 100%; padding: 15px; border: 0; border-radius: 12px;
  font: 800 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .2em; text-transform: uppercase;
  color: #0b0b12; background: linear-gradient(90deg, #ff2d78, #ff7ab0);
  box-shadow: 0 10px 26px rgba(255,45,120,.4); cursor: pointer;
  transition: transform .15s;
}
.btn:active { transform: scale(.97); }
.screen {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background: radial-gradient(circle at 50% 50%, #1a0f2a 0%, #06060c 70%);
  transition: opacity .6s, visibility .6s;
}
.screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.surprise-inner { text-align: center; padding: 24px; }
.surprise-title {
  font: 800 22px/1.2 "Inter", system-ui, sans-serif;
  letter-spacing: .06em; text-transform: uppercase;
  color: #f2f2fa; margin: 0 0 12px;
}
.surprise-sub {
  font: 400 13px/1.5 "Inter", system-ui, sans-serif;
  color: #9a9ab8; margin: 0 0 32px; max-width: 280px;
}
.surprise-btn {
  -webkit-appearance: none; appearance: none;
  padding: 18px 44px; border: 0; border-radius: 14px;
  font: 800 15px/1 ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .3em; text-transform: uppercase; color: #fff;
  background: linear-gradient(135deg, #ff2d78, #7c5cff);
  box-shadow: 0 12px 40px rgba(255,45,120,.5), 0 0 60px rgba(124,92,255,.4), inset 0 1px 0 rgba(255,255,255,.3);
  cursor: pointer; transition: transform .15s;
  animation: btnPulse 2s ease-in-out infinite;
}
.surprise-btn:active { transform: scale(.96); }
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 12px 40px rgba(255,45,120,.5), 0 0 60px rgba(124,92,255,.4), inset 0 1px 0 rgba(255,255,255,.3); }
  50% { box-shadow: 0 12px 60px rgba(255,45,120,.8), 0 0 100px rgba(124,92,255,.7), inset 0 1px 0 rgba(255,255,255,.3); }
}
.yin-yang {
  width: 96px; height: 96px;
  animation: spin 2.4s linear infinite;
  margin: 0 auto 26px;
  filter: drop-shadow(0 0 24px rgba(255,45,120,.5));
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font: 700 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .32em; text-transform: uppercase; color: #ff9ec4;
}
.loading-text span { display: inline-block; animation: dotBlink 1.4s infinite; opacity: 0; }
.loading-text span:nth-child(1) { animation-delay: 0s; }
.loading-text span:nth-child(2) { animation-delay: 0.22s; }
.loading-text span:nth-child(3) { animation-delay: 0.44s; }
@keyframes dotBlink { 0%, 60%, 100% { opacity: 0; } 30% { opacity: 1; } }
</style>
</head>
<body>

<audio id="bgMusic" loop preload="none">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="screen" id="surpriseScreen">
  <div class="surprise-inner">
    <h1 class="surprise-title">A Road For You</h1>
    <p class="surprise-sub">Nine moments. One long drive. Ready?</p>
    <button class="surprise-btn" id="surpriseBtn">Surprise</button>
  </div>
</div>

<div class="screen hidden" id="loadingScreen">
  <div style="text-align:center;">
    <svg class="yin-yang" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="50" fill="#f2f2fa"/>
      <path d="M50,0 a50,50 0 0,1 0,100 a25,25 0 0,1 0,-50 a25,25 0 0,0 0,-50" fill="#0b0b12"/>
      <circle cx="50" cy="25" r="6" fill="#f2f2fa"/>
      <circle cx="50" cy="75" r="6" fill="#0b0b12"/>
    </svg>
    <div class="loading-text">Life Loading<span>.</span><span>.</span><span>.</span></div>
  </div>
</div>

<div class="scenes">
  <div class="scene"></div><div class="scene"></div><div class="scene"></div>
  <div class="scene"></div><div class="scene"></div><div class="scene"></div>
  <div class="scene"></div><div class="scene"></div><div class="scene"></div>
  <div class="scene"></div>
</div>
<div class="overlay-grid"></div>
<div class="scanlines"></div>

<div class="app">
  <header class="hud">
    <div>
      <span class="hud-label">// MISSION LOG</span>
      <span class="hud-title">The Long Road</span>
    </div>
    <div class="hud-right">
      <div class="hud-count" id="count">00 / 09</div>
      <button class="mute-btn" id="muteBtn" aria-label="Mute">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="bar-wrap"><div class="bar"><div class="bar-fill" id="barFill"></div></div></div>

  <main class="viewport" id="viewport">
    <div class="world" id="world">
      <div class="road">
        <div class="markers" id="markers"></div>
      </div>
      <div class="car" id="car">
        <svg viewBox="0 0 100 220" xmlns="http://www.w3.org/2000/svg">

              <stop offset="0" stop-color="#4a6378"/><stop offset="0.35" stop-color="#1e2f3f"/>
              <stop offset="0.65" stop-color="#2a4055"/><stop offset="1" stop-color="#0a1520"/>
            </linearGradient>
            <linearGradient id="chromeG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d0d5da"/><stop offset="0.25" stop-color="#ffffff"/>
              <stop offset="0.5" stop-color="#e0e5ea"/><stop offset="0.75" stop-color="#ffffff"/>

              <stop offset="1" stop-color="#7a7f8a"/>
            </linearGradient>
            <radialGradient id="tireG" cx="0.4" cy="0.4" r="0.7">
              <stop offset="0" stop-color="#2a2a2a"/><stop offset="0.6" stop-color="#0a0a0a"/><stop offset="1" stop-color="#000"/>
            </radialGradient>
            <radialGradient id="headG">
              <stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#fffbe0"/>
              <stop offset="0.8" stop-color="#e8d070"/><stop offset="1" stop-color="#a08030"/>
            </radialGradient>
          </defs>
          <ellipse cx="50" cy="112" rx="46" ry="108" fill="#000" opacity="0.45"/>

          <path d="M 12 174 L 1 200 L 6 210 L 15 205 L 17 182 Z" fill="url(#paintG)"/>

          <path d="M 14 22 Q 14 12 26 10 L 74 10 Q 86 12 86 22 L 88 30 L 12 30 Z" fill="#fff" opacity="0.18"/>

          <ellipse cx="22" cy="7" rx="5" ry="7" fill="url(#chromeG)"/>
          <ellipse cx="78" cy="7" rx="5" ry="7" fill="url(#chromeG)"/>
          <ellipse cx="22" cy="213" rx="5" ry="7" fill="url(#chromeG)"/>
          <ellipse cx="78" cy="213" rx="5" ry="7" fill="url(#chromeG)"/>

          <rect x="66.5" y="22" width="1.5" height="20" fill="#000" opacity="0.25"/>

          <circle cx="82" cy="20" r="2.5" fill="#fff"/>
          <path d="M 24 60 Q 24 58 26 58 L 74 58 Q 76 58 76 60 L 72 44 Q 72 42 70 42 L 30 42 Q 28 42 28 44 Z" fill="url(#glassG)"/>
          <path d="M 26 56 L 32 56 L 30 44 L 27 46 Z" fill="#fff" opacity="0.3"/>
          <path d="M 22 64 L 78 64 L 78 128 L 22 128 Z" fill="url(#roofG)"/>
          <path d="M 22 64 L 30 64 L 30 128 L 22 128 Z" fill="#fff" opacity="0.2"/>
          <line x1="22" y1="70" x2="78" y2="70" stroke="#6a6f7a" stroke-width="0.6" opacity="0.6"/>
          <line x1="22" y1="124" x2="78" y2="124" stroke="#6a6f7a" stroke-width="0.6" opacity="0.6"/>
          <path d="M 24 134 Q 24 132 26 132 L 74 132 Q 76 132 76 134 L 72 150 Q 72 152 70 152 L 30 152 Q 28 152 28 150 Z" fill="url(#glassG)"/>
          <path d="M 26 134 L 32 134 L 30 150 L 27 148 Z" fill="#fff" opacity="0.22"/>
          <path d="M 11 60 L 11 168" stroke="url(#chromeG)" stroke-width="2"/>
          <path d="M 89 60 L 89 168" stroke="url(#chromeG)" stroke-width="2"/>

pacity="0.2"/><circle cx="330" cy="690" r="11" fill="#ffe066" opacity="0.2"/>')
);
const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const markersEl = document.getElementById('markers');
const car = document.getElementById('car');
const modal = document.getElementById('modal');
const collageEl = document.getElementById('collage');
const numEl = document.getElementById('num');
const iconEl = document.getElementById('icon');
const titleEl = document.getElementById('title');
const captionEl = document.getElementById('caption');
const closeBtn = document.getElementById('closeBtn');
const countEl = document.getElementById('count');
const barFill = document.getElementById('barFill');
const hint = document.getElementById('hint');
const sceneEls = document.querySelectorAll('.scene');

const SPACING = 500;
const EDGE_TOP = 400;
const EDGE_BOTTOM = 400;
const START_BELOW = 300;
const ACCEL = 0.55;
const MAX_SPEED = 11;

const visited = new Set();
let carCenterY = 0;
let carH = 100;
let carMinY = 0;
let carMaxY = 0;
let worldHeight = 0;
let vel = 0;
let gasDown = false;
let revDown = false;
let locked = false;
let ignoreMilestoneId = -1;   // NEW: milestone to skip until we drive away from it
let currentMilestoneId = -1;  // NEW: tracks which card is open

const pad = n => String(n).padStart(2, '0');

SCENE_BACKGROUNDS.forEach((bg, i) => { if (sceneEls[i]) sceneEls[i].style.backgroundImage = bg; });
function setScene(idx) { sceneEls.forEach((el, i) => el.classList.toggle('active', i === idx)); }

function placeholder(label) {
  const safe = String(label).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="600" height="400" fill="#12121b"/><rect x="1" y="1" width="598" height="398" fill="none" stroke="#ff2d78" stroke-opacity="0.28" stroke-dasharray="10 8"/><text x="300" y="196" font-family="monospace" font-size="17" fill="#5c5c78" text-anchor="middle">' + safe + '</text><text x="300" y="224" font-family="monospace" font-size="12" fill="#3c3c52" text-anchor="middle">add this file to /images</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

MILESTONES.forEach((m, i) => {
  m.id = i;
  const el = document.createElement('div');
  el.className = 'marker';
  const s = document.createElement('span');
  s.textContent = pad(i + 1);
  el.appendChild(s);
  markersEl.appendChild(el);
  m.el = el;
});

function computeLayout() {
  worldHeight = (MILESTONES.length - 1) * SPACING + EDGE_TOP + EDGE_BOTTOM;
  world.style.height = worldHeight + 'px';
  carH = car.offsetHeight || 100;
  MILESTONES.forEach((m, i) => {
    m.worldY = worldHeight - EDGE_BOTTOM - i * SPACING;
    m.el.style.top = (m.worldY - 13) + 'px';
  });
  carMinY = MILESTONES[MILESTONES.length - 1].worldY - 20;
  carMaxY = MILESTONES[0].worldY + START_BELOW;
}

function render() {
  const carTop = carCenterY - carH / 2;
  car.style.transform = 'translate(-50%, ' + carTop + 'px)';
  const vh = viewport.clientHeight;
  const targetCam = carCenterY - vh * 0.55;
  const maxCam = Math.max(0, worldHeight - vh);
  const cam = Math.max(0, Math.min(maxCam, targetCam));
  world.style.transform = 'translate3d(0, ' + (-cam) + 'px, 0)';
}

// CHANGED: glow now shows for any milestone, visited or not
function updateGlow() {
  let near = false;
  for (const m of MILESTONES) {
    if (Math.abs(carCenterY - m.worldY) < 80) { near = true; break; }
  }
  car.classList.toggle('lit', near);
}

// NEW: clear the ignore flag once we're far enough away
function clearIgnoreIfFar() {
  if (ignoreMilestoneId < 0) return;
  const m = MILESTONES[ignoreMilestoneId];
  if (Math.abs(carCenterY - m.worldY) > 120) {
    ignoreMilestoneId = -1;
  }
}

// CHANGED: allow re-opening ANY milestone (forward or reverse)
function checkArrival() {
  for (const m of MILESTONES) {
    if (m.id === ignoreMilestoneId) continue;   // skip the one we just closed
    if (Math.abs(carCenterY - m.worldY) < 40) {
      vel = 0;
      carCenterY = m.worldY;
      render();
      updateGlow();
      openCard(m);
      return true;
    }
  }
  return false;
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(50, now - lastTime) / 16.67;
  lastTime = now;
  if (!locked) {
    clearIgnoreIfFar();                         // NEW
    if (gasDown) vel = Math.max(vel - ACCEL * dt, -MAX_SPEED);
    else if (revDown) vel = Math.min(vel + ACCEL * dt, MAX_SPEED);
    else vel *= Math.pow(0.82, dt);
    if (Math.abs(vel) < 0.05) vel = 0;
    if (vel !== 0) {
      carCenterY += vel * dt;
      carCenterY = Math.max(carMinY, Math.min(carMaxY, carCenterY));
      render();
      if (Math.abs(vel) > 0.4) checkArrival();
      updateGlow();
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function openCard(m) {
  locked = true;
  currentMilestoneId = m.id;          // NEW
  gasDown = false; revDown = false;
  document.getElementById('pedalGas').classList.remove('pressed');
  document.getElementById('pedalRev').classList.remove('pressed');
  numEl.textContent = pad(m.id + 1);
  iconEl.textContent = m.icon || '•';
  titleEl.textContent = m.title || '';
  captionEl.textContent = m.caption || '';
  collageEl.innerHTML = '';
  const imgs = m.imgs || [];
  for (let i = 0; i < 3; i++) {
    const fig = document.createElement('figure');
    fig.className = i === 0 ? 'hero' : 'thumb';
    const img = document.createElement('img');
    img.alt = '';
    const src = imgs[i] || '';
    img.onerror = function () { img.onerror = null; img.src = placeholder(src || ('0' + (m.id + 1) + 'abc'[i] + '.jpg')); };
    img.src = src || placeholder('0' + (m.id + 1) + 'abc'[i] + '.jpg');
    fig.appendChild(img);
    collageEl.appendChild(fig);
  }
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  setScene(m.id + 1);
  visited.add(m.id);
  m.el.classList.add('done');
  updateProgress();
}

function closeCard() {
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  locked = false;
  ignoreMilestoneId = currentMilestoneId;  // NEW: don't instantly re-open this one
  currentMilestoneId = -1;                 // NEW
  if (visited.size === MILESTONES.length) {
    hint.textContent = 'Road complete — happy birthday';
    hint.classList.remove('hidden');
    setTimeout(() => hint.classList.add('hidden'), 6000);
  }
}

function updateProgress() {
  countEl.textContent = pad(visited.size) + ' / ' + pad(MILESTONES.length);
  barFill.style.width = (visited.size / MILESTONES.length * 100) + '%';
}

closeBtn.addEventListener('click', closeCard);
modal.addEventListener('click', (e) => { if (e.target === modal) closeCard(); });

function bindPedal(el, setter) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    setter(true);
    el.classList.add('pressed');
    hint.classList.add('hidden');
  });
  const end = () => { setter(false); el.classList.remove('pressed'); };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
}
bindPedal(document.getElementById('pedalGas'), v => gasDown = v);
bindPedal(document.getElementById('pedalRev'), v => revDown = v);

window.addEventListener('keydown', e => {
  if (locked) return;
  if (e.key === 'ArrowUp') { e.preventDefault(); gasDown = true; hint.classList.add('hidden'); }
  if (e.key === 'ArrowDown') { e.preventDefault(); revDown = true; }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') gasDown = false;
  if (e.key === 'ArrowDown') revDown = false;
});

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { computeLayout(); render(); }, 120); });
window.addEventListener('orientationchange', () => setTimeout(() => { computeLayout(); render(); }, 250));

const bgMusic = document.getElementById('bgMusic');
const muteBtn = document.getElementById('muteBtn');
const muteIcon = document.getElementById('muteIcon');
const MUTE_ON = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';
const MUTE_OFF = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
muteBtn.addEventListener('click', () => {
  bgMusic.muted = !bgMusic.muted;
  muteBtn.classList.toggle('muted', bgMusic.muted);
  muteIcon.setAttribute('d', bgMusic.muted ? MUTE_OFF : MUTE_ON);
});

function boot() {
  computeLayout();
  carCenterY = carMaxY;
  render();
  setScene(0);
  updateProgress();
}
window.addEventListener('load', () => { computeLayout(); render(); });
boot();
setTimeout(() => { computeLayout(); render(); }, 150);

const surpriseScreen = document.getElementById('surpriseScreen');
const loadingScreen = document.getElementById('loadingScreen');
const surpriseBtn = document.getElementById('surpriseBtn');

surpriseBtn.addEventListener('click', () => {
  bgMusic.volume = 0.75;
  bgMusic.play().catch(() => {});
  surpriseScreen.classList.add('hidden');
  loadingScreen.classList.remove('hidden');
  setTimeout(() => {
    loadingScreen.classList.add('hidden');
    setTimeout(() => { computeLayout(); render(); }, 700);
  }, 3000);
});
</script>
</body>
</html>
